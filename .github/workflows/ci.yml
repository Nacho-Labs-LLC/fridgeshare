name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results/playwright-artifacts
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build --tag fridgeshare-ci-smoke .
      - name: Run Docker runtime smoke test
        run: FRIDGESHARE_RUNTIME_IMAGE=fridgeshare-ci-smoke npm run test:runtime
